2" font-family="DejaVu Sans Mono" font-size="11.5" fill="#98989D" text-anchor="middle">2022</text><circle cx="933.3" cy="378.7" r="5" fill="#fff" stroke="#E8362A" stroke-width="2.5"/><text x="933.3" y="364.7" font-family="DejaVu Sans Mono" font-size="12" font-weight="bold" fill="#1D1D1F" text-anchor="middle">1160K</text><text x="933.3" y="559.2" font-family="DejaVu Sans Mono" font-size="11.5" fill="#98989D" text-anchor="middle">2023</text><circle cx="1100.0" cy="386.0" r="5" fill="#fff" stroke="#E8362A" stroke-width="2.5"/><text x="1100.0" y="372.0" font-family="DejaVu Sans Mono" font-size="12" font-weight="bold" fill="#1D1D1F" text-anchor="middle">1130K</text><text x="1100.0" y="559.2" font-family="DejaVu Sans Mono" font-size="11.5" fill="#98989D" text-anchor="middle">2024</text><line x1="266.7" y1="350.2" x2="266.7" y2="545.2" stroke="#1D1D1F" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/><circle cx="214.66666666666663" cy="332.2" r="5" fill="#E8362A"/><circle cx="227.66666666666663" cy="332.2" r="5" fill="#E8362A"/><circle cx="240.66666666666663" cy="332.2" r="5" fill="#E8362A"/><circle cx="253.66666666666663" cy="332.2" r="5" fill="#E8362A"/><circle cx="266.66666666666663" cy="332.2" r="5" fill="#E8362A"/><text x="266.7" y="320.2" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" fill="#6E6E73" text-anchor="middle">Drive to Survive premieres here</text><text x="70" y="664.2" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1D1D1F">Which metric grew the fastest?</text><text x="70" y="690.2" font-family="DejaVu Sans" font-size="13.5" fill="#6E6E73">Total growth rate for each metric, 2018/2019/2020 → 2024/2025</text><rect x="70" y="720.2" width="1060" height="260" rx="20" fill="#F5F5F7"/><path d="M 154.7 895.2 A 92 92 0 0 1 338.7 895.2" fill="none" stroke="#F5F5F7" stroke-width="14" stroke-linecap="round"/><path d="M 154.7 895.2 A 92 92 0 0 1 268.9 805.9" fill="none" stroke="#E8362A" stroke-width="14" stroke-linecap="round"/><line x1="246.66666666666666" y1="895.2" x2="264.9" y2="822.0" stroke="#1D1D1F" stroke-width="2.5"/><circle cx="246.66666666666666" cy="895.2" r="5" fill="#1D1D1F"/><text x="246.66666666666666" y="787" font-family="DejaVu Sans Mono" font-size="26" font-weight="bold" fill="#1D1D1F" text-anchor="middle">+104%</text><text x="246.66666666666666" y="923.2" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#6E6E73" text-anchor="middle"><tspan x="246.66666666666666" dy="0" text-anchor="middle">US Audience</tspan></text><path d="M 508.0 895.2 A 92 92 0 0 1 692.0 895.2" fill="none" stroke="#F5F5F7" stroke-width="14" stroke-linecap="round"/><path d="M 508.0 895.2 A 92 92 0 0 1 554.0 815.5" fill="none" stroke="#E8362A" stroke-width="14" stroke-linecap="round"/><line x1="600.0" y1="895.2" x2="562.3" y2="829.9" stroke="#1D1D1F" stroke-width="2.5"/><circle cx="600.0" cy="895.2" r="5" fill="#1D1D1F"/><text x="600.0" y="787" font-family="DejaVu Sans Mono" font-size="26" font-weight="bold" fill="#1D1D1F" text-anchor="middle">+60%</text><text x="600.0" y="923.2" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#6E6E73" text-anchor="middle"><tspan x="600.0" dy="0" text-anchor="middle">Race Attendance</tspan></text><path d="M 861.3 895.2 A 92 92 0 0 1 1045.3 895.2" fill="none" stroke="#F5F5F7" stroke-width="14" stroke-linecap="round"/><path d="M 861.3 895.2 A 92 92 0 0 1 1045.2 890.4" fill="none" stroke="#E8362A" stroke-width="14" stroke-linecap="round"/><line x1="953.3333333333334" y1="895.2" x2="1028.7" y2="891.3" stroke="#1D1D1F" stroke-width="2.5"/><circle cx="953.3333333333334" cy="895.2" r="5" fill="#1D1D1F"/><text x="953.3333333333334" y="787" font-family="DejaVu Sans Mono" font-size="26" font-weight="bold" fill="#1D1D1F" text-anchor="middle">+177%</text><text x="953.3333333333334" y="923.2" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#6E6E73" text-anchor="middle"><tspan x="953.3333333333334" dy="0" text-anchor="middle">Social Followers</tspan></text><text x="70" y="1024.2" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#E8362A">A nuance almost no one mentions</text><text x="70" y="1052.2" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1D1D1F"><tspan x="70" dy="0">After the 2022 peak, US audience plateaued</tspan></text><rect x="70" y="1098.8" width="1060" height="130" rx="16" fill="#F5F5F7" stroke="#E8362A" stroke-width="1.5"/><text x="98" y="1159.375" font-family="DejaVu Sans" font-size="14.5" fill="#1D1D1F"><tspan x="98" dy="0">1.20M (2022) → 1.16M (2023) → 1.13M (2024) — a 5.8% drop from the record. The initial explosive</tspan><tspan x="98" dy="18.85">growth has already matured into a plateau, not an infinite curve.</tspan></text><text x="70" y="1272.8" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#E8362A">Does the show's quality predict growth?</text><text x="70" y="1300.8" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1D1D1F">All 4 seasons, side by side</text><rect x="70" y="1330.8" width="1060" height="330" rx="20" fill="#F5F5F7"/><line x1="130" y1="1364.8" x2="130" y2="1554.8" stroke="#D2D2D7" stroke-width="1.5"/><line x1="130" y1="1554.8" x2="650" y2="1554.8" stroke="#D2D2D7" stroke-width="1.5"/><text x="390.0" y="1588.8" font-family="DejaVu Sans" font-size="11.5" fill="#6E6E73" text-anchor="middle">Season Tomatometer (%)</text><text x="84" y="1459.8" font-family="DejaVu Sans" font-size="11.5" fill="#6E6E73" text-anchor="middle" transform="rotate(-90 84 1459.8)">Next year's audience growth (%)</text><circle cx="608.4" cy="1492.2" r="9" fill="#E8362A" opacity="0.85"/><text x="608.4" y="1476.2" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#1D1D1F" text-anchor="middle">S1</text><circle cx="244.4" cy="1432.8" r="9" fill="#E8362A" opacity="0.85"/><text x="244.4" y="1416.8" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#1D1D1F" text-anchor="middle">S4</text><circle cx="561.6" cy="1427.4" r="9" fill="#E8362A" opacity="0.85"/><text x="561.6" y="1411.4" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#1D1D1F" text-anchor="middle">S5</text><text x="130.0" y="1570.8" font-family="DejaVu Sans Mono" font-size="10" fill="#98989D" text-anchor="middle">0</text><text x="260.0" y="1570.8" font-family="DejaVu Sans Mono" font-size="10" fill="#98989D" text-anchor="middle">25</text><text x="390.0" y="1570.8" font-family="DejaVu Sans Mono" font-size="10" fill="#98989D" text-anchor="middle">50</text><text x="520.0" y="1570.8" font-family="DejaVu Sans Mono" font-size="10" fill="#98989D" text-anchor="middle">75</text><text x="650.0" y="1570.8" font-family="DejaVu Sans Mono" font-size="10" fill="#98989D" text-anchor="middle">100</text><text x="700" y="1394.8" font-family="DejaVu Sans" font-size="14" fill="#1D1D1F"><tspan x="700" dy="0">No clear pattern — the worst-</tspan><tspan x="700" dy="18.2">reviewed season (Season 4, 22%)</tspan><tspan x="700" dy="18.2">didn't have the worst subsequent</tspan><tspan x="700" dy="18.2">growth. The real correlation is</tspan><tspan x="700" dy="18.2">weak and not significant (r=0.50,</tspan><tspan x="700" dy="18.2">n=4).</tspan></text><text x="70" y="1704.8" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#6E6E73">AI FORECAST (PROPHET) · 2025-2028</text><rect x="70" y="1730.8" width="1060" height="190" rx="20" fill="#F5F5F7"/><path d="M700.0,1806.4 L800.0,1782.2 L900.0,1775.7 L1000.0,1767.4 L1100.0,1758.8 L1100.0,1777.8 L1000.0,1784.8 L900.0,1792.7 L800.0,1800.1 Z" fill="#E8362A" opacity="0.10"/><path d="M100.0,1843.3 L200.0,1835.7 L300.0,1840.4 L400.0,1819.0 L500.0,1801.9 L600.0,1804.5 L700.0,1806.4" fill="none" stroke="#1D1D1F" stroke-width="2.5"/><path d="M700.0,1806.4 L800.0,1791.3 L900.0,1783.8 L1000.0,1776.2 L1100.0,1768.6" fill="none" stroke="#E8362A" stroke-width="2.5"