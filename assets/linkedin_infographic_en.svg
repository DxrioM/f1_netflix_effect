eight="76" rx="12" fill="#1B1E27" stroke="#2A2E3A"/><text x="891.5" y="216" font-family="DejaVu Sans Mono" font-size="24" font-weight="bold" fill="#4CAF6D">$2.04B</text><text x="891.5" y="236" font-family="DejaVu Sans" font-size="10.5" font-weight="bold" fill="#9BA1AE"><tspan x="891.5" dy="0">Record 2024 Sponsorship</tspan></text><text x="70" y="294" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#F2F3F5">US audience growth</text><rect x="70" y="320" width="1060" height="300" rx="16" fill="#1B1E27" stroke="#2A2E3A"/><text x="98" y="354" font-family="DejaVu Sans" font-size="13" fill="#9BA1AE">Average viewers per race (ESPN)</text><rect x="126.7" y="477.3" width="86.1" height="87.7" rx="4" fill="#E8B84F"/><text x="169.7" y="469.2833333333333" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#F2F3F5" text-anchor="middle">554K</text><text x="169.7" y="585" font-family="DejaVu Sans Mono" font-size="11" fill="#656B78" text-anchor="middle">2018</text><rect x="270.1" y="458.6" width="86.1" height="106.4" rx="4" fill="#3FC9E0"/><text x="313.1" y="450.6" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#F2F3F5" text-anchor="middle">672K</text><text x="313.1" y="585" font-family="DejaVu Sans Mono" font-size="11" fill="#656B78" text-anchor="middle">2019</text><rect x="413.5" y="470.2" width="86.1" height="94.8" rx="4" fill="#3FC9E0"/><text x="456.6" y="462.2058333333333" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#F2F3F5" text-anchor="middle">599K</text><text x="456.6" y="585" font-family="DejaVu Sans Mono" font-size="11" fill="#656B78" text-anchor="middle">2020</text><rect x="557.0" y="417.1" width="86.1" height="147.9" rx="4" fill="#3FC9E0"/><text x="600.0" y="409.1166666666667" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#F2F3F5" text-anchor="middle">934K</text><text x="600.0" y="585" font-family="DejaVu Sans Mono" font-size="11" fill="#656B78" text-a