<style>
:root{
  --bg:#14161C; --card:#1B1E27; --card2:#20232E; --border:#2A2E3A;
  --text:#F2F3F5; --text2:#9BA1AE; --text3:#656B78;
  --broadcast:#E8B84F; --streaming:#3FC9E0; --good:#4CAF6D; --bad:#E0524A;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
.container{max-width:1160px; margin:0 auto; padding:0 24px;}
a{color:inherit;}
h1,h2,h3{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
.flagstrip{height:8px; background-image:repeating-linear-gradient(90deg,#fff 0 14px,#14161C 14px 28px); opacity:0.9;}

nav{position:sticky; top:0; z-index:100; background:rgba(20,22,28,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
nav .container{display:flex; align-items:center; justify-content:space-between; height:58px;}
.logo{font-family:'Rajdhani'; font-weight:700; font-size:19px; letter-spacing:0.02em;}
.logo span{color:var(--streaming);}
.navlinks{list-style:none; display:flex; align-items:center; gap:24px;}
nav a.navlink{font-size:14px; color:var(--text2); transition:color .15s;}
nav a.navlink:hover{color:var(--text);}
@media(max-width:820px){.navlinks li:not(.lang-item){display:none;}}
.lang-switch{display:flex; gap:6px;}
.lang-switch a{font-size:11px; font-weight:600; padding:4px 9px; border:1px solid var(--border); border-radius:20px; color:var(--text2);}
.lang-switch a.active{color:var(--bg); background:var(--streaming); border-color:var(--streaming);}

.hero{padding:56px 0 0;}
.hero-top{padding-bottom:28px;}
.hero h1{font-size:clamp(34px,5.4vw,58px); line-height:1.05; margin-bottom:16px; max-width:820px;}
.hero h1 .bc{color:var(--broadcast);} .hero h1 .st{color:var(--streaming);}
.hero p{font-size:17px; color:var(--text2); max-width:660px;}
.hero .meta{font-size:12.5px; color:var(--text3); margin-top:14px; font-family:'IBM Plex Mono';}

.hero-chart-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:26px; margin-top:8px;}
.hero-chart-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:4px;}
.hero-chart-head h3{font-size:20px;}
.hero-chart-head .big{font-family:'Rajdhani'; font-size:34px; font-weight:700; color:var(--streaming);}
.legend-row{display:flex; gap:20px; margin-top:16px; flex-wrap:wrap;}
.legend-row .item{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text2);}
.legend-row .sw{width:12px; height:12px; border-radius:3px;}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:20px;}
@media(max-width:760px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.kpi .val{font-family:'Rajdhani'; font-size:26px; font-weight:700;}
.kpi .lbl{font-size:12px; color:var(--text2); margin-top:3px;}

section{padding:64px 0;}
section.alt{background:var(--card2); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.section-head{max-width:680px; margin-bottom:32px;}
.section-head h2{font-size:clamp(24px,3vw,32px); margin-bottom:10px;}
.section-head p{color:var(--text2); font-size:15px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; min-width:0;}
.card h3{font-family:'IBM Plex Sans'; font-weight:600; font-size:15.5px; margin-bottom:2px; letter-spacing:0;}
.card .sub{font-size:12.5px; color:var(--text2); margin-bottom:16px;}
.card canvas{max-height:270px; max-width:100%;}
.chart-error{font-size:12px; color:var(--text3); padding:30px 0; text-align:center;}

.finding-card{background:linear-gradient(135deg, rgba(232,184,79,0.08), rgba(63,201,224,0.08)); border:1px solid var(--border); border-radius:var(--radius); padding:28px;}
.finding-card .big{font-family:'Rajdhani'; font-size:clamp(26px,3.6vw,38px); font-weight:700; margin:10px 0;}

.season-row{display:flex; flex-direction:column; gap:10px;}
.season-item{display:grid; grid-template-columns:70px 1fr 90px 90px; align-items:center; gap:14px; padding:12px 16px; background:var(--card2); border-radius:10px;}
@media(max-width:640px){
  .season-item{grid-template-columns:50px 1fr; grid-template-areas:"badge desc" "score1 score2"; row-gap:8px;}
  .season-item > *:nth-child(1){grid-area:badge;}
  .season-item > *:nth-child(2){grid-area:desc;}
  .season-item > *:nth-child(3){grid-area:score1; text-align:left;}
  .season-item > *:nth-child(4){grid-area:score2; text-align:right;}
}
.season-item .badge{font-family:'Rajdhani'; font-weight:700; font-size:15px; text-align:center;}
.season-item .desc{font-size:13px; color:var(--text2);}
.season-item .score{font-family:'IBM Plex Mono'; font-size:13px; text-align:right;}

.stack-badges{display:flex; flex-wrap:wrap; gap:10px;}
.badge-pill{padding:8px 16px; background:var(--card); border:1px solid var(--border); border-radius:20px; font-size:13px; color:var(--text2);}

footer{padding:48px 0; text-align:center; border-top:1px solid var(--border);}
footer p{font-size:12px; color:var(--text3); max-width:640px; margin:0 auto; line-height:1.6;}
</style>

  kpi1:"US audience growth 2018→2024", kpi2:"Record 2025 attendance", kpi3:"2024 social followers", kpi4:"Record 2024 sponsorship",

  legend_pre:"Before Drive to Survive (2018)", legend_post:"Drive to Survive era (2019+)",
  aud_h2:"The growth wasn't just in the US", aud_sub:"Global TV audience and physical trackside attendance — two different metrics telling the same story.",
  chart_global_h3:"Cumulative global TV audience", chart_global_sub:"Billions of viewers per season",
  chart_attendance_h3:"Total season attendance", chart_attendance_sub:"Millions of trackside spectators",
  dts_h2:"Does the show's quality explain the growth?", dts_sub:"I compared the real Tomatometer score of each Drive to Survive season against my own AI-powered sentiment analysis (VADER) of critic reviews.",

const T = I18N[LANG] || I18N.es;

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[key] !== undefined) el.textContent = T[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const key = el.getAttribute('data-i18n-html');
    if(T[key] !== undefined) el.innerHTML = T[key];
  });
}
applyI18n();

let EDA={}, AI={};
try{
  EDA = JSON.parse(document.getElementById('data-eda').textContent);
  AI = JSON.parse(document.getElementById('data-ai').textContent);
}catch(e){ console.error('Error parsing embedded data', e); }

const BC = '#E8B84F', ST = '#3FC9E0', GOOD='#4CAF6D', BAD='#E0524A';
const TXT2 = '#9BA1AE';
const GRID = 'rgba(255,255,255,0.06)';

if(typeof Chart !== 'undefined'){
  Chart.defaults.color = TXT2;
  Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
  Chart.defaults.font.size = 12;
}

function safeChart(canvasId, config){
  try{
    if(typeof Chart === 'undefined') throw new Error('Chart.js unavailable');
    const el = document.getElementById(canvasId);
    if(!el) return null;
    return new Chart(el, config);
  }catch(err){
    console.error('Chart error ['+canvasId+']', err);
    const el = document.getElementById(canvasId);
    if(el && el.parentNode){
      const msg = document.createElement('div');
      msg.className = 'chart-error';
      msg.textContent = T.chart_error;
      el.parentNode.replaceChild(msg, el);
    }
    return null;
  }
}

// ---------- HERO: audiencia EE.UU. ----------
safeChart('chart-hero', {
  type:'bar',
  data:{

// ---------- FORECASTS ----------
function buildForecastChart(canvasId, histSeries, histKey, forecastList, unitDiv){
  const histLabels = histSeries.map(d=>d.year);
  const histVals = histSeries.map(d=>d[histKey] / (unitDiv||1));
  const fcLabels = forecastList.map(d=>d.year);
  const fcVals = forecastList.map(d=>d.pred / (unitDiv||1));
  const fcLower = forecastList.map(d=>d.lower / (unitDiv||1));
  const fcUpper = forecastList.map(d=>d.upper / (unitDiv||1));
  const allLabels = [...histLabels, ...fcLabels];
  const histData = [...histVals, ...Array(fcLabels.length).fill(null)];
  const fcData = [...Array(histLabels.length-1).fill(null), histVals[histVals.length-1], ...fcVals];
  const bandUpper = [...Array(histLabels.length).fill(null), ...fcUpper];
  const bandLower = [...Array(histLabels.length).fill(null), ...fcLower];
  safeChart(canvasId, {
    type:'line',
    data:{labels:allLabels, datasets:[
      {label:'IC 80%', data:bandUpper, borderColor:'transparent', backgroundColor:'rgba(63,201,224,0.12)', fill:'+1', pointRadius:0},
      {label:'IC 80% inf', data:bandLower, borderColor:'transparent', backgroundColor:'rgba(63,201,224,0.12)', fill:false, pointRadius:0},
      {label:T.legend_real, data:histData, borderColor:BC, backgroundColor:BC, tension:0.15, pointRadius:4},
      {label:T.legend_proyeccion, data:fcData, borderColor:ST, borderDash:[6,4], tension:0.15, pointRadius:4, pointBackgroundColor:ST},
    ]},
    options:{responsive:true, plugins:{legend:{display:true, position:'bottom', labels:{filter:(item)=>item.text===T.legend_real||item.text===T.legend_proyeccion, boxWidth:10, padding:12}}},
      scales:{y:{grid:{color:GRID}}, x:{grid:{display:false}}}}
  });
}
try{
  buildForecastChart('chart-forecast-view', EDA.us_viewership_serie||[], 'viewers', AI.us_viewership_forecast||[], 1000);
  buildForecastChart('chart-forecast-att', EDA.attendance_serie||[], 'millones', AI.attendance_forecast||[], 1);
}catch(e){ console.error(e); }
